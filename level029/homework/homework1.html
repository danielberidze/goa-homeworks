<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seminar Schedule</title>
    <style>
        table {
            border-collapse: collapse;
            font-family: Georgia, serif;
            width: 700px;
        }
        td, th {
            border: 1px solid black;
            padding: 8px 12px;
            text-align: center;
        }
        .yellow { background-color: #f9f6c6; }
        .purple { background-color: #c9b8e0; }
        .green { background-color: #b8e0c0; }
    </style>
</head>
<body>

    <table border="1">
       <tr>
        <th rowspan="3">Day</th>
        <th colspan="3">Seminar</th>
       </tr>
       <tr>
        <th colspan="2">Schedule</th>
        <th rowspan="2">Topic</th>
       </tr>
       <tr>
        <th>Begin</th>
        <th>End</th>
       </tr>

       <tr>
        <td rowspan="2">Monday</td>
        <td class="yellow">8:00 a.m.</td>
        <td class="purple">5:00 p.m.</td>
        <td>Introduction to XML</td>
       </tr>
       <tr>
        <td class="yellow">8:00 a.m.</td>
        <td class="purple">5:00 p.m.</td>
        <td>Validity: DTD and Relax NG</td>
       </tr>

       <tr>
        <td rowspan="3">Tuesday</td>
        <td class="yellow">8:00 a.m.</td>
        <td class="yellow">11:00 a.m.</td>
        <td>XPath</td>
       </tr>
       <tr>
        <td class="yellow">11:00 a.m.</td>
        <td class="green">2:00 p.m.</td>
        <td rowspan="2">XSL Transformations</td>
       </tr>
       <tr>
        <td class="purple">2:00 p.m.</td>
        <td class="purple">5:00 p.m.</td>
       </tr>

       <tr>
        <td>Wednesday</td>
        <td class="yellow">8:00 a.m.</td>
        <td class="green">12:00 p.m.</td>
        <td>XSL Formatting Objects</td>
       </tr>
    </table>

</body>
</html>
